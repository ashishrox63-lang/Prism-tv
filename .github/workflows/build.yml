name: Build Prism APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare prism.apk and version.json
        run: |
          cp android/app/build/outputs/apk/release/*.apk prism.apk
          CODE=$((GITHUB_RUN_NUMBER + 1))
          cat > version.json <<EOF
          {"versionCode": $CODE, "versionName": "2.$GITHUB_RUN_NUMBER", "apk": "https://github.com/$GITHUB_REPOSITORY/releases/download/latest/prism.apk"}
          EOF
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-TV-Home-APK
          path: |
            prism.apk
            version.json

      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest prism.apk version.json --title "Prism ${GITHUB_RUN_NUMBER}" --notes "Latest Prism TV Home build." --latest
